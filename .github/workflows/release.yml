name: Verify and release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: twilight_test
          POSTGRES_PASSWORD: ci_disposable_only
          POSTGRES_DB: twilight_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U twilight_test -d twilight_test" --health-interval 5s --health-retries 12
    env:
      TWILIGHT_TEST_DSN: postgres://twilight_test:ci_disposable_only@127.0.0.1:5432/twilight_test?sslmode=disable
      TWILIGHT_DATABASE_URL: postgres://twilight_test:ci_disposable_only@127.0.0.1:5432/twilight_test?sslmode=disable
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: upstream/twilight/go.mod
          cache-dependency-path: upstream/twilight/go.sum
      - name: Validate deployment files
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci_disposable_only/;s/^TWILIGHT_TWO_FACTOR_KEY=$/TWILIGHT_TWO_FACTOR_KEY=ci_only/;s/^BOT_INTERNAL_SECRET=$/BOT_INTERNAL_SECRET=ci_only/' .env
          docker compose config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify gateway rejects foreign-origin mutations
        run: |
          docker run -d --name gateway-check -e PUBLIC_SITE_ORIGIN=https://account.example.test -e PUBLIC_SHOP_ORIGIN=https://shop.example.test -p 127.0.0.1:13000:8080 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          trap 'docker logs gateway-check; docker rm -f gateway-check >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://untrusted.invalid' http://127.0.0.1:13000/api/v2/auth/logout || true)
            [[ "$code" == 403 ]] && break
            sleep 1
          done
          [[ "$code" == 403 ]]
          for origin in http://localhost:13000 http://127.0.0.1:13000 https://account.example.test https://shop.example.test; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: $origin" http://127.0.0.1:13000/api/v2/auth/logout)
            echo "Allowed origin $origin returned $code"
            [[ "$code" != 403 ]]
          done
      - name: Verify actual TLS and public entrance isolation
        run: python3 tests/network_integration.py
      - name: Core database, configuration and authentication tests
        working-directory: upstream/twilight
        run: |
          go mod verify
          go vet ./...
          go test ./internal/retention ./internal/playback -count=1
          python3 scripts/check-frontend-v2-coverage.py
          go test -p 1 ./internal/config ./internal/security ./internal/store ./internal/api -run 'Test.*(Setup|Login|Session|Config|TwoFactor|Register|Password|DeploymentUpdate|Invite|RegCode|Regcode|PublicBaseURL|Jianwei|MiniApp)' -count=1 -timeout=25m
  images:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Build application images
        run: |
          version=$(cat VERSION)
          docker build -f deploy/backend.Dockerfile -t "emby-cloud-backend:$version" .
          docker build -f deploy/webui.Dockerfile -t "emby-cloud-webui:$version" .
          mkdir -p dist
          docker save "emby-cloud-backend:$version" | gzip -1 > "dist/backend-$version-amd64.tar.gz"
          docker save "emby-cloud-webui:$version" | gzip -1 > "dist/webui-$version-amd64.tar.gz"
          python3 scripts/package-release.py
      - name: Exercise install, upgrade, rollback and uninstall on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          sudo --preserve-env=GITHUB_ACTIONS python3 tests/lifecycle.py
      - name: Stage a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^false$'; then
            echo 'Refusing to replace an already published release; increment VERSION.'
            exit 1
          fi
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --draft --target "$GITHUB_SHA" --title "v$version · 见微 Emby 正式版本" --notes-file docs/release-notes.md
          gh release edit "v$version" --draft=true --target "$GITHUB_SHA" --title "v$version · 见微 Emby 正式版本" --notes-file docs/release-notes.md
          gh release upload "v$version" dist/* --clobber
  publish:
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$(cat VERSION)" --draft=false
